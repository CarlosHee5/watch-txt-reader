name: Build APKs

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runners ship with the Android SDK preinstalled (ANDROID_HOME);
      # AGP downloads any missing platform/build-tools automatically.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      # Provides caching, and puts a fixed Gradle 8.7 on PATH as a fallback
      # in case gradle/wrapper/gradle-wrapper.jar is ever missing.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Phone and watch APKs MUST be signed with the same key (Wear Data Layer requirement).
      # If repo secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD exist, use them
      # (stable key -> later releases install as updates). Otherwise generate a throwaway keystore for
      # this run: both APKs of the run share it, but the key changes between runs.
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/watchtxt.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from repository secrets"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KS"
            STORE_PW="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PW="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "No KEYSTORE_BASE64 secret: generating a temporary keystore for this run"
            STORE_PW="watchtxt-$(openssl rand -hex 12)"
            ALIAS="watchtxt"
            KEY_PW="$STORE_PW"
            keytool -genkeypair -noprompt -keystore "$KS" -storetype PKCS12 \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PW" -keypass "$KEY_PW" -dname "CN=WatchTxt, O=WatchTxt, C=CN"
          fi
          echo "::add-mask::$STORE_PW"
          echo "::add-mask::$KEY_PW"
          {
            echo "WATCHTXT_KEYSTORE=$KS"
            echo "WATCHTXT_KEYSTORE_PASSWORD=$STORE_PW"
            echo "WATCHTXT_KEY_ALIAS=$ALIAS"
            echo "WATCHTXT_KEY_PASSWORD=$KEY_PW"
          } >> "$GITHUB_ENV"

      - name: Build phone + watch APKs
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace :mobile:assembleDebug :wear:assembleDebug
          else
            gradle --no-daemon --stacktrace :mobile:assembleDebug :wear:assembleDebug
          fi

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp mobile/build/outputs/apk/debug/*.apk dist/watchtxt-phone.apk
          cp wear/build/outputs/apk/debug/*.apk dist/watchtxt-watch.apk
          ls -la dist

      - name: Verify both APKs share the same signing certificate
        continue-on-error: true
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found, skipping"; exit 0; fi
          P=$("$APKSIGNER" verify --print-certs dist/watchtxt-phone.apk | grep 'SHA-256' | head -1)
          W=$("$APKSIGNER" verify --print-certs dist/watchtxt-watch.apk | grep 'SHA-256' | head -1)
          echo "phone: $P"
          echo "watch: $W"
          [ "$P" = "$W" ] || { echo "::error::Phone and watch APK signatures differ"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watchtxt-apks
          path: dist/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/watchtxt-phone.apk
            dist/watchtxt-watch.apk
          generate_release_notes: true
